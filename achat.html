<!DOCTYPE html>
<html lang="fr">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Achat</title>
    <style>
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: black;
        }

        header {
            background: #0f0130;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1E90FF;
        }

        .logo img {
            height: 80px;
            margin-left: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        nav a:hover {
            color: #1E90FF;
        }

        .slogan {
            font-size: 28px;
            font-weight: 700;
            color: #1E90FF;
            text-shadow: 0px 0px 10px #1E90FF, 0px 0px 20px #1E90FF;
            letter-spacing: 2px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .achat-box {
            background: #0f0135;
            padding: 30px;
            border-radius: 10px;
            color: white;
        }

        h2 {
            color: #1E90FF;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #1E90FF;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .btn {
            background: #1E90FF;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
        }

        .btn:hover {
            background: #1466cc;
        }

        .btn-ajouter {
            background: #28a745;
        }

        .btn-ajouter:hover {
            background: #218838;
        }

        .btn-supprimer {
            background: #dc3545;
            padding: 5px 10px;
            font-size: 14px;
        }

        .panier {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        .produit-panier {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            color: #1E90FF;
            border-top: 2px solid #1E90FF;
            padding-top: 10px;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            padding: 15px;
            margin-top: 30px;
            background: #0f0130;
            border-top: 2px solid #1E90FF;
            font-size: 14px;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo4.png" alt="Logo GameZone">
        </div>
        <h2 class="slogan">Level up your gear</h2>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="inscription.html">Inscription</a>
            <a href="achat.html">Acheter</a>
        </nav>
    </header>

    <div class="container">
        <div class="achat-box">
            <h2>Acheter des Produits</h2>
            
            
            <div class="form-group">
                <label for="produit">Choisir un produit :</label>
                <select id="produit">
                    <option value="">-- Sélectionnez un produit --</option>
                    <option value="99.9|Clavier RGB">Clavier RGB - 99,900 TND</option>
                    <option value="449.9|Souris 6400 DPI">Souris 6400 DPI - 449,900 TND</option>
                    <option value="278.9|Casque Gaming">Casque Gaming - 278,900 TND</option>
                    <option value="48.9|Tapis RGB">Tapis RGB - 48,900 TND</option>
                    <option value="90|Clavier RGB">Clavier RGB - 90,000 TND</option>
                    <option value="70|Souris 6400 DPI">Souris 6400 DPI - 70,000 TND</option>
                    <option value="240|Casque Gaming">Casque Gaming - 240,000 TND</option>
                    <option value="120|Tapis RGB">Tapis RGB - 120,000 TND</option>
                    <option value="70|Clavier RGB">Clavier RGB - 70,000 TND</option>
                    <option value="520|Souris 6400 DPI">Souris 6400 DPI - 520,000 TND</option>
                    <option value="50|Casque Gaming">Casque Gaming - 50,000 TND</option>
                    <option value="48.9|Tapis RGB">Tapis RGB - 30,000 TND</option>

                    <option value="176|SPIRIT OF GAMER PACK 4EN1 PRO-MKH5">SPIRIT OF GAMER PACK 4EN1 PRO-MKH5 - 176,000 TND</option>
                    <option value="389|REDRAGON PACK 5EN1">REDRAGON PACK 5EN1 - 389,000 TND</option>
                    <option value="135|PACK GAMING – WHITE EDITION">PACK GAMING – WHITE EDITION - 135,000 TND</option>
                    <option value="389|PACK GAMING REDRAGON">PACK GAMING REDRAGON - 389,000 TND</option>
                    <option value="199|REDRAGON PACK 5EN1">REDRAGON PACK 5EN1 - 199,000 TND</option>
                    <option value="340|PACK GAMER 4EN1">PACK GAMER 4EN1 - 340,000 TND</option>
                    <option value="259|PACK GAMER RGB SOG">PACK GAMER RGB SOG - 259,000 TND</option>
                    <option value="145|The G-Lab COMBO ARGON E (FR)">The G-Lab COMBO ARGON E (FR) - 145,000 TND</option>

                    <option value="5059|PC Portable Gamer MSI">PC Portable Gamer MSI - 5059,000 TND</option>
                    <option value="3379|GIGABYTE G6 MF">GIGABYTE G6 MF - 3379,000 TND</option>
                    <option value="3899|MSI Cyborg 15">MSI Cyborg 15 - 3899,000 TND</option>
                    <option value="2099|PC Portable - ASUS TUF Gaming A15">PC Portable - ASUS TUF Gaming A15 - 2099,000 TND</option>
                    <option value="2639|Pc Portable Lenovo">Pc Portable Lenovo - 2639,000 TND</option>
                    <option value="6296|MSI Crosshair 18 HX">MSI Crosshair 18 HX - 6296,000 TND</option>
                    <option value="2249|PC Portable Gamer - Lenovo">PC Portable Gamer - Lenovo - 2249,000 TND</option>
                    <option value="3648|PC PORTABLE GAMER MSI KATANA">PC PORTABLE GAMER MSI KATANA - 3648,000 TND</option>
                </select>
                
                <label for="quantite">Quantité :</label>
                <input type="number" id="quantite" min="1" value="1">
                
                <button class="btn btn-ajouter" onclick="ajouterAuPanier()">Ajouter au panier</button>
            </div>
            
            
            <div class="panier">
                <h3>Votre Panier</h3>
                <div id="liste-panier">
                    <p>Votre panier est vide</p>
                </div>
                
                <div class="total">
                    <span>Total : </span>
                    <span id="total-panier">0 TND</span>
                </div>
                
                <button class="btn" onclick="acheterPanier()">Acheter tout le panier</button>
                <button class="btn" onclick="viderPanier()" style="background: #dc3545;">Vider le panier</button>
            </div>
        </div>
    </div>

    <footer>
        <div>
            <div style="font-weight:700" class="slogan">GameZone</div>
            <div class="small muted">contact@gamezone.tn WhatsApp: +216 23 294 498</div>
        </div> 
        <div class="social"> 
            <a href="https://www.facebook.com/youssef.hajsaid.5">Facebook</a>
            <a href="https://www.instagram.com/rima.lagati?igsh=M2l1ZmZhN284djht">Instagram</a> 
        </div>
    </footer>

    <script>
        let panier = [];
        const fraisLivraison = 10.000;
        function ajouterAuPanier() {
            const selectProduit = document.getElementById('produit');
            const valeur = selectProduit.value;
            
            if (!valeur) {
                alert('Veuillez sélectionner un produit');
                return;
            }
            
            const [prixStr, nom] = valeur.split('|');
            const prix = parseFloat(prixStr);
            const quantite = parseInt(document.getElementById('quantite').value) || 1;
            let produitExiste = false;
            for (let i = 0; i < panier.length; i++) {
                if (panier[i].nom === nom) {
                    panier[i].quantite += quantite;
                    produitExiste = true;
                    break;
                }
            }
            if (!produitExiste) {
                panier.push({
                    nom: nom,
                    prix: prix,
                    quantite: quantite
                });
            }
            afficherPanier();
            document.getElementById('quantite').value = 1;
        }
        function afficherPanier() {
            const listePanier = document.getElementById('liste-panier');
            
            if (panier.length === 0) {
                listePanier.innerHTML = '<p>Votre panier est vide</p>';
                document.getElementById('total-panier').textContent = '0 TND';
                return;
            }
            
            let html = '';
            let total = 0;
            
            for (let i = 0; i < panier.length; i++) {
                const produit = panier[i];
                const sousTotal = produit.prix * produit.quantite;
                total += sousTotal;
                
                html += `
                    <div class="produit-panier">
                        <div>
                            <strong>${produit.nom}</strong><br>
                            ${produit.prix.toFixed(3)} TND × ${produit.quantite}
                        </div>
                        <div>
                            ${sousTotal.toFixed(3)} TND
                            <button class="btn btn-supprimer" onclick="supprimerDuPanier(${i})">×</button>
                        </div>
                    </div>
                `;
            }
            total += fraisLivraison;
            
            listePanier.innerHTML = html;
            document.getElementById('total-panier').textContent = total.toFixed(3) + ' TND';
        }
        function supprimerDuPanier(index) {
            panier.splice(index, 1);
            afficherPanier();
        }
        function viderPanier() {
            panier = [];
            afficherPanier();
        }
        function acheterPanier() {
            if (panier.length === 0) {
                alert('Votre panier est vide');
                return;
            }
            
            let details = 'Détails de votre commande :\n\n';
            let total = 0;
            
            for (let i = 0; i < panier.length; i++) {
                const produit = panier[i];
                const sousTotal = produit.prix * produit.quantite;
                total += sousTotal;
                details += `${produit.nom} - ${produit.quantite} × ${produit.prix.toFixed(3)} TND = ${sousTotal.toFixed(3)} TND\n`;
            }
            
            total += fraisLivraison;
            details += `\nFrais de livraison : ${fraisLivraison.toFixed(3)} TND`;
            details += `\n\nTOTAL : ${total.toFixed(3)} TND`;
            
            const confirmer = confirm(`${details}\n\nConfirmer l'achat ?`);
            
            if (confirmer) {
                alert('Commande confirmée ! Merci pour votre achat.');
                viderPanier();
            }
        }
        afficherPanier();
    </script>
</body>
</html>
