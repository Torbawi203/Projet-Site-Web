name: Docker CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t my-app .
      - name: Test Container
        run: |
          docker run -d -p 80:80 --name test my-app
          sleep 5
          curl localhost:80